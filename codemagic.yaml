workflows:
  ios-unsigned-ipa-workflow:
    name: Alarm Samy - Build iOS IPA (Unsigned for Sideloadly / AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS Release (No Codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Runner.app into Alarm_Samy.ipa
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Alarm_Samy.ipa Payload
    artifacts:
      - build/ios/iphoneos/Alarm_Samy.ipa
      - build/ios/iphoneos/*.app
